<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0ea5e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Olango">
<title>🌴 Olango</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌴</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌴</text></svg>">
<link rel="manifest" href='data:application/manifest+json,{"name":"Olango Trip","short_name":"Olango","start_url":".","display":"standalone","background_color":"%23fdfaf6","theme_color":"%230ea5e9","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌴</text></svg>","sizes":"any","type":"image/svg+xml"}]}'>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#fdfaf6;--card:#ffffff;--text:#18181b;--soft:#52525b;--faint:#a1a1aa;
  --border:#e7e5e0;--border-2:#f4f2ed;
  --ocean:#0ea5e9;--ocean-dk:#0284c7;--ocean-lt:#e0f2fe;
  --sand:#f5e6c8;--sun:#f59e0b;--palm:#10b981;--coral:#ef4444;--dusk:#8b5cf6;
  --shadow:0 2px 8px rgba(24,24,27,.04);
  --shadow-md:0 8px 24px rgba(24,24,27,.06);
  --shadow-lg:0 20px 40px rgba(24,24,27,.1);
  --r:16px;--r-lg:24px;--r-xl:28px;
  --safe-t:env(safe-area-inset-top,0);
  --safe-b:env(safe-area-inset-bottom,0);
  --safe-l:env(safe-area-inset-left,0);
  --safe-r:env(safe-area-inset-right,0);
  --nav-h:64px;
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100dvh;padding-top:var(--safe-t);padding-left:var(--safe-l);padding-right:var(--safe-r)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s,border-color .15s;min-height:44px;min-width:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ocean);outline-offset:2px}
input,select{font:inherit;color:inherit;min-height:44px}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#d4d4d8;border-radius:99px}

.app{display:grid;grid-template-columns:1fr;min-height:100dvh}

.sidebar{display:none;position:sticky;top:0;height:100dvh;padding:24px 16px;border-right:1px solid var(--border);background:var(--card)}
.sidebar-logo{font-size:32px;margin-bottom:24px;padding:8px}
.sidebar nav{display:flex;flex-direction:column;gap:6px}
.side-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600;color:var(--soft);width:100%;text-align:left}
.side-btn.active,.side-btn:hover{background:var(--ocean-lt);color:var(--ocean-dk)}
.side-btn .ic{font-size:20px;width:24px;text-align:center}

@media (min-width:900px){
  .app{grid-template-columns:220px 1fr}
  .sidebar{display:flex;flex-direction:column}
  .bottom-nav{display:none!important}
  main{padding-bottom:40px!important}
}
@media (min-width:1400px){.app{grid-template-columns:260px 1fr}}

main{padding:16px 14px calc(var(--nav-h) + var(--safe-b) + 20px);max-width:1400px;margin:0 auto;width:100%}
@media (min-width:640px){main{padding:24px 20px 40px}}
@media (min-width:900px){main{padding:24px 32px 40px}}

.grid-mem{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));margin-bottom:16px}

#loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0f9ff,#fef3c7);transition:opacity .35s,visibility .35s}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
#loader .logo{font-size:64px;animation:float 2s ease-in-out infinite}
#loader p{margin-top:14px;font-weight:700;color:var(--soft);font-size:13px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);background:linear-gradient(135deg,#0284c7 0%,#0d9488 55%,#10b981 100%);color:#fff;padding:22px 20px;box-shadow:var(--shadow-lg);margin-bottom:14px}
@media (min-width:640px){.hero{padding:32px 28px}}
.hero::before{content:"";position:absolute;top:-80px;right:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero::after{content:"";position:absolute;bottom:-120px;left:-60px;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero-grid{position:relative;display:flex;flex-direction:column;gap:20px;z-index:2}
@media (min-width:900px){.hero-grid{flex-direction:row;align-items:center;justify-content:space-between}}
.badge-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;min-height:24px}
.dot{width:6px;height:6px;background:#bef264;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.cloud{font-size:9px;font-weight:900;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;min-height:24px;display:inline-flex;align-items:center}
.cloud.live{background:rgba(16,185,129,.3);color:#d1fae5;border:1px solid rgba(52,211,153,.5)}
.cloud.local{background:rgba(245,158,11,.3);color:#fef3c7;border:1px solid rgba(251,191,36,.5)}
.cloud.saving{background:rgba(59,130,246,.3);color:#dbeafe;border:1px solid rgba(147,197,253,.5)}

.hero h1{font-size:clamp(24px,5vw,34px);font-weight:900;line-height:1.15;margin-top:8px;letter-spacing:-.02em}
.clock{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 12px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.15);border-radius:10px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;min-height:28px}
.clock .d{width:6px;height:6px;background:#4ade80;border-radius:50%;animation:pulse 1s infinite}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.15);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:700;min-height:26px;display:inline-flex;align-items:center}
.chip.urgent{background:rgba(239,68,68,.35);border-color:rgba(252,165,165,.5)}
.chip.win{background:rgba(16,185,129,.35);border-color:rgba(110,231,183,.5)}
.chip.predict{background:rgba(139,92,246,.3);border-color:rgba(196,181,253,.5)}

.target{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:20px;min-width:min(100%,280px)}
.target .l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#ccfbf1}
.target .a{font-size:clamp(28px,6vw,36px);font-weight:900;margin-top:2px;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.target .c{font-size:13px;margin-top:6px;color:#f1f5f9}
.target .c b{color:#6ee7b7;font-weight:800}
.bar{height:10px;background:rgba(255,255,255,.2);border-radius:999px;overflow:hidden;margin-top:12px}
.bar-fill{height:100%;background:linear-gradient(90deg,#34d399,#6ee7b7);border-radius:999px;transition:width 1s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.bar-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shimmer 2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.countdown{margin-top:12px;padding:10px 12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px}
.countdown .l{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#fde68a}
.countdown .v{font-size:15px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;margin-top:2px}

.toolbar{display:none;gap:8px;flex-wrap:wrap;align-items:center;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--r);padding:8px;margin-bottom:14px;position:sticky;top:12px;z-index:30;box-shadow:var(--shadow)}
@media (min-width:900px){.toolbar{display:flex}}
.spacer{flex:1}

.btn{padding:10px 14px;border-radius:12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:44px}
.btn:active{transform:scale(.96)}
.btn-p{background:linear-gradient(135deg,var(--ocean),var(--ocean-dk));color:#fff;box-shadow:0 4px 12px rgba(14,165,233,.3)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(14,165,233,.4)}
.btn-s{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn-s:hover{background:var(--border-2)}
.btn-w{background:#fef2f2;border:1px solid #fecaca;color:#dc2626}
.btn-l{background:#f5f3ff;border:1px solid #ddd6fe;color:#6d28d9}
.btn-ic{width:44px;height:44px;padding:0;justify-content:center;border-radius:12px;font-size:16px}

.pay-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
@media (min-width:640px){.pay-grid{grid-template-columns:1fr 1fr}}
.pay{color:#fff;border-radius:var(--r-lg);padding:18px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:12px}
.pay.gcash{background:linear-gradient(135deg,#0284c7,#2563eb)}
.pay.mari{background:linear-gradient(135deg,#ea580c,#f59e0b)}
.pay::before{content:"";position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.1)}
.pay-tag{background:#fff;font-size:10px;font-weight:900;padding:4px 10px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase;display:inline-block;position:relative;min-height:22px;align-self:flex-start}
.pay.gcash .pay-tag{color:#0284c7}
.pay.mari .pay-tag{color:#ea580c}
.pay-row{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative}
.pay-info{flex:1;min-width:0}
.pay-name{font-weight:800;font-size:13px;opacity:.9;margin-bottom:2px}
.pay-num{font-size:clamp(20px,4vw,26px);font-weight:900;letter-spacing:.02em;color:#fff;text-align:left;word-break:break-all;line-height:1.1}
.pay-actions{display:flex;gap:8px;position:relative}
.pay-btn{padding:8px 12px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:10px;font-size:11px;font-weight:800;color:#fff;min-height:36px}
.pay-btn:hover{background:rgba(255,255,255,.3)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.sec{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.sec h2{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec h2::before{content:"";width:4px;height:18px;border-radius:99px;background:var(--ocean)}
.sec-link{font-size:12px;font-weight:700;color:var(--ocean-dk);padding:6px 10px;border-radius:8px}
.sec-link:hover{background:var(--ocean-lt)}

.mem{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s,border-color .2s}
.mem:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--ocean-lt)}
.mem.done{border-color:var(--palm);background:#f0fdf4}
.mem-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.av{width:38px;height:38px;border-radius:12px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.mem-nm{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.streak{font-size:11px;font-weight:800;color:var(--sun);display:flex;align-items:center;gap:2px;background:#fef3c7;padding:2px 6px;border-radius:6px}
.mem-tag{font-size:9px;font-weight:900;padding:2px 6px;border-radius:6px}
.mem-tag.done{background:#d1fae5;color:#047857}
.mem-tag.behind{background:#fee2e2;color:#dc2626}
.mem-tag.ahead{background:#dbeafe;color:#1d4ed8}
.mem-tag.ok{background:#fef3c7;color:#b45309}
.mem-amt{font-size:22px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mem-sub{font-size:11px;color:var(--soft);font-weight:600}
.mem-warn{font-size:10px;font-weight:700;color:var(--coral);margin-top:4px;background:#fef2f2;padding:2px 6px;border-radius:6px;display:inline-block}
.mem-bar{height:6px;background:var(--border-2);border-radius:99px;overflow:hidden;margin-top:10px}
.mem-bar-fill{height:100%;border-radius:99px;transition:width .6s}
.mem-btns{display:flex;gap:6px;margin-top:10px}
.qbtn{flex:1;padding:8px;background:var(--ocean-lt);color:var(--ocean-dk);border-radius:10px;font-size:12px;font-weight:800;min-height:36px}
.qbtn:hover{background:var(--ocean);color:#fff}
.qbtn.done{background:#d1fae5;color:#047857;cursor:default}
.qbtn.late{background:#f5f3ff;color:#6d28d9;flex:none;padding:8px 10px;min-width:44px}
.qbtn.late:hover{background:var(--dusk);color:#fff}

.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.tbl-hd{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.tbl-hd h2{font-size:14px;font-weight:800}
.tbl-sub{font-size:11px;color:var(--soft);font-weight:600}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:640px;border-collapse:collapse}
th{background:var(--bg);padding:10px 8px;font-size:10px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
td{padding:9px 6px;font-size:12px;border-bottom:1px solid var(--border-2);text-align:center}
tr.now td{background:rgba(14,165,233,.06)}
tr.now td:first-child{border-left:3px solid var(--ocean)}
tr.past{opacity:.7}
.pill{display:inline-flex;padding:5px 8px;border-radius:8px;font-size:11px;font-weight:800;gap:3px;cursor:pointer;transition:transform .1s;align-items:center;min-height:28px;min-width:44px;justify-content:center}
.pill:hover{transform:scale(1.05)}
.pill.paid{background:#d1fae5;color:#047857}
.pill.late{background:#ede9fe;color:#6d28d9}
.pill.part{background:#fef3c7;color:#b45309}
.pill.miss{background:#fee2e2;color:#dc2626}
.pill.none{background:var(--border-2);color:var(--faint)}
.pill.pend{background:#e0e7ff;color:#4338ca}
.pill.add{background:var(--ocean-lt);color:var(--ocean-dk);font-weight:900}
.pill.add:hover{background:var(--ocean);color:#fff}
tfoot tr{background:var(--bg);font-weight:900}
tfoot td{padding:12px 8px;border-top:2px solid var(--border)}
.now-b{display:inline-block;margin-left:5px;padding:2px 7px;background:var(--ocean);color:#fff;font-size:9px;font-weight:900;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;animation:pulse 2s infinite}
.past-b{margin-left:5px;font-size:9px;color:var(--faint);font-weight:700}
.up-b{margin-left:5px;font-size:9px;color:#6366f1;font-weight:700}

.recent-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px}
.recent-body{flex:1;min-width:0}
.recent-nm{font-weight:800;font-size:13px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.recent-mt{font-size:11px;color:var(--soft);margin-top:2px}
.recent-a{font-weight:900;color:var(--palm);font-size:14px;font-variant-numeric:tabular-nums}
.tag{background:#ede9fe;color:#6d28d9;font-size:9px;font-weight:900;padding:2px 6px;border-radius:6px;letter-spacing:.05em}
.ib{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:var(--bg);flex-shrink:0}
.ib.edit:hover{background:#fef3c7;color:#b45309}
.ib.del:hover{background:#fee2e2;color:#dc2626}

.modal{position:fixed;inset:0;z-index:100;display:none}
.modal.open{display:block}
.modal-bg{position:absolute;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(8px);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-w{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;padding-bottom:var(--safe-b)}
@media (min-width:640px){.modal-w{align-items:center;padding:20px}}
.mc{pointer-events:auto;width:100%;max-width:520px;max-height:92dvh;background:var(--card);border-radius:24px 24px 0 0;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 -20px 40px rgba(0,0,0,.15);animation:slide .3s cubic-bezier(.16,1,.3,1)}
@media (min-width:640px){.mc{border-radius:24px}}
.mc.lg{max-width:680px}
@keyframes slide{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
.mh{padding:16px 20px;background:linear-gradient(135deg,var(--ocean),var(--ocean-dk));color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mh h3{font-size:17px;font-weight:800}
.mh p{font-size:11px;opacity:.9;margin-top:2px}
.mx{width:38px;height:38px;background:rgba(255,255,255,.2);border-radius:50%;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mb{padding:20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--soft);text-transform:uppercase;margin-bottom:6px;letter-spacing:.04em}
.fg input,.fg select{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:15px;font-weight:600;background:var(--bg);color:var(--text)}
.fg input:focus,.fg select:focus{border-color:var(--ocean);outline:none;background:#fff}
.amt-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.amt-c{padding:6px 12px;background:var(--ocean-lt);color:var(--ocean-dk);border-radius:8px;font-size:12px;font-weight:800;min-height:32px}
.amt-c:hover{background:var(--ocean);color:#fff}
.auto{border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.auto.now{background:linear-gradient(135deg,#f0f9ff,#e0f2fe);border:1px solid #bae6fd}
.auto.late{background:linear-gradient(135deg,#f5f3ff,#ede9fe);border:1px solid #ddd6fe}
.auto.edit{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fde68a}
.auto-ic{width:38px;height:38px;color:#fff;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.auto.now .auto-ic{background:var(--ocean)}
.auto.late .auto-ic{background:var(--dusk)}
.auto.edit .auto-ic{background:var(--sun)}
.auto-l{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.auto.now .auto-l{color:var(--ocean-dk)}
.auto.late .auto-l{color:#6d28d9}
.auto.edit .auto-l{color:#b45309}
.auto-v{font-size:13px;font-weight:800;margin-top:2px}
.auto-s{font-size:11px;color:var(--soft);margin-top:1px}
.toggle{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:12px;border:1px solid var(--border)}

<script>
/* ================================================================
   HARD FAILSAFE — Loader ALWAYS hides within 2 seconds no matter what
================================================================ */
var __loaderHidden = false;
function hideLoader(){
  if (__loaderHidden) return;
  __loaderHidden = true;
  try {
    var el = document.getElementById("loader");
    if (el) el.classList.add("hide");
    setTimeout(function(){ try{ el && el.remove(); }catch(e){} }, 600);
  } catch(e){}
}
// Multiple guaranteed unlocks
setTimeout(hideLoader, 2000);
window.addEventListener("load", function(){ setTimeout(hideLoader, 500); });
window.addEventListener("error", function(){ hideLoader(); });
window.addEventListener("unhandledrejection", function(){ hideLoader(); });
document.addEventListener("DOMContentLoaded", function(){ setTimeout(hideLoader, 800); });

/* ================================================================
   LAZY-LOAD Firebase, confetti, QR — none of them can block UI
================================================================ */
function loadScript(src, timeoutMs){
  return new Promise(function(resolve){
    try {
      var s = document.createElement("script");
      var done = false;
      var finish = function(ok){ if(done) return; done = true; resolve(!!ok); };
      s.src = src; s.async = true;
      s.onload = function(){ finish(true); };
      s.onerror = function(){ finish(false); };
      document.head.appendChild(s);
      setTimeout(function(){ finish(false); }, timeoutMs || 3000);
    } catch(e){ resolve(false); }
  });
}

/* ================================================================
   FIREBASE CONFIG — Singapore (kept as-is)
================================================================ */
var firebaseConfig = {
  apiKey: "AIzaSyAdu2G69SBviKXD6jMFGssb_1LcTXIgaf0",
  authDomain: "olangotrip.firebaseapp.com",
  databaseURL: "https://olangotrip-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "olangotrip",
  storageBucket: "olangotrip.firebasestorage.app",
  messagingSenderId: "693372588889",
  appId: "1:693372588889:web:ba96b6c10a223e3f5e7248",
  measurementId: "G-PG3E62SWG8"
};

var STORAGE_KEY = "olango_trip_v5";
var TZ = "Asia/Manila";

var DB=null, dbRef=null, isOnline=false;
var editingId=null, payType="normal", syncTO=null;
var milestones=new Set();
var undoStack=null;
var hasConfetti=false, hasQR=false;

var defaultState = {
  tripName: "🌴 Olango Island Trip",
  rate: 30,
  startDate: "2026-08-28",
  weeksCount: 17,
  gcashName: "KXI", gcashNumber: "09939336295",
  mariName: "KXI",  mariNumber:  "13397715774",
  members: [
    {id:1,name:"Fatima"},{id:2,name:"Kurt"},
    {id:3,name:"Johnchris"},{id:4,name:"Tina"}
  ],
  payments: [],
  lastUpdated: 0
};

/* ================================================================
   Device
================================================================ */
var device = {
  isTouch: ('ontouchstart' in window) || navigator.maxTouchPoints > 0,
  isDesktop: window.matchMedia && window.matchMedia('(min-width:1025px)').matches,
  reducedMotion: window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches
};
function haptic(p){ if(device.isTouch && navigator.vibrate){ try{ navigator.vibrate(p||10); }catch(e){} } }

/* ================================================================
   Storage
================================================================ */
function loadLocal(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      var parsed = JSON.parse(raw);
      return Object.assign({}, defaultState, parsed);
    }
  } catch(e){}
  return JSON.parse(JSON.stringify(defaultState));
}
function saveLocal(){
  try {
    state.lastUpdated = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e){}
}
function sync(){
  saveLocal();
  if (!isOnline || !dbRef) return;
  clearTimeout(syncTO);
  setCloud("saving");
  syncTO = setTimeout(function(){
    try {
      dbRef.set(state).then(function(){ setCloud(true); }).catch(function(){ setCloud(false); });
    } catch(e){ setCloud(false); }
  }, 250);
}

var state = loadLocal();

/* ================================================================
   Cloud badge
================================================================ */
function setCloud(s){
  try {
    var el = document.getElementById("cloud");
    if (!el) return;
    if (s === "saving"){ el.className = "cloud saving"; el.textContent = "💾 Saving"; }
    else if (s === true){ isOnline = true; el.className = "cloud live"; el.textContent = "🟢 Live"; }
    else { isOnline = false; el.className = "cloud local"; el.textContent = "🟡 Local"; }
  } catch(e){}
}

/* ================================================================
   Firebase init — never blocks UI
================================================================ */
function initFirebase(){
  loadScript("https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js", 3500).then(function(ok1){
    if (!ok1 || !window.firebase){ setCloud(false); return; }
    loadScript("https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js", 3500).then(function(ok2){
      if (!ok2){ setCloud(false); return; }
      try {
        firebase.initializeApp(firebaseConfig);
        DB = firebase.database();
        dbRef = DB.ref("olango_tracker_v5");

        // hard cloud timeout — if no response in 4s, stay local
        var cloudSettled = false;
        setTimeout(function(){ if (!cloudSettled){ setCloud(false); } }, 4000);

        dbRef.on("value", function(snap){
          cloudSettled = true;
          try {
            var val = snap.val();
            if (val && Array.isArray(val.members) && val.members.length){
              var ct = Number(val.lastUpdated) || 0;
              var lt = Number(state.lastUpdated) || 0;
              if (ct >= lt){
                state = Object.assign({}, defaultState, val);
                saveLocal();
                renderAll();
              } else {
                sync();
              }
            } else {
              // cloud empty — push local up, never wipe
              sync();
            }
            setCloud(true);
          } catch(e){ setCloud(false); }
        }, function(){
          cloudSettled = true;
          setCloud(false);
        });
      } catch(e){ setCloud(false); }
    });
  });
}

/* ================================================================
   Time helpers
================================================================ */
function nowMs(){ return Date.now(); }
function weekDeadline(i){
  var parts = state.startDate.split("-").map(Number);
  var dt = new Date(Date.UTC(parts[0], parts[1]-1, parts[2], 15, 59, 59, 999));
  dt.setUTCDate(dt.getUTCDate() + 7*i);
  return dt.getTime();
}
function weekDate(i){
  var parts = state.startDate.split("-").map(Number);
  var dt = new Date(Date.UTC(parts[0], parts[1]-1, parts[2], 4, 0, 0));
  dt.setUTCDate(dt.getUTCDate() + 7*i);
  return dt;
}
function curWeek(){
  var n = nowMs();
  for (var i=0; i<state.weeksCount; i++) if (n <= weekDeadline(i)) return i;
  return state.weeksCount - 1;
}
function isPast(i){ return nowMs() > weekDeadline(i); }
function isFuture(i){ return i > curWeek(); }
function fmtD(d){ try{ return new Date(d).toLocaleDateString("en-PH",{timeZone:TZ,weekday:"short",month:"short",day:"numeric"}); }catch(e){ return ""; } }
function fmtDT(d){ try{ return new Date(d).toLocaleString("en-PH",{timeZone:TZ,month:"short",day:"numeric",hour:"numeric",minute:"2-digit",hour12:true}); }catch(e){ return ""; } }
function fmtClock(){ try{ return new Date().toLocaleString("en-PH",{timeZone:TZ,weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true}); }catch(e){ return ""; } }
function countdown(ms){
  var d = ms - nowMs();
  if (d <= 0) return "⚠ Passed";
  var dy=Math.floor(d/86400000), h=Math.floor(d%86400000/3600000), m=Math.floor(d%3600000/60000), s=Math.floor(d%60000/1000);
  if (dy>0) return dy+"d "+h+"h "+m+"m";
  if (h>0) return h+"h "+m+"m "+s+"s";
  return m+"m "+s+"s";
}

/* ================================================================
   Calculations
================================================================ */
function memPaid(mid){ return (state.payments||[]).filter(function(p){return p.memberId===mid;}).reduce(function(s,p){return s+Number(p.amount||0);},0); }
function memWeekPaid(mid,w){ return (state.payments||[]).filter(function(p){return p.memberId===mid && Number(p.weekIndex)===w;}).reduce(function(s,p){return s+Number(p.amount||0);},0); }
function isLate(p){ if(p.isLate) return true; return new Date(p.timestamp).getTime() > weekDeadline(Number(p.weekIndex)); }
function memMissed(mid){ var m=[],c=curWeek(); for (var i=0;i<c;i++) if (isPast(i) && memWeekPaid(mid,i)<state.rate) m.push(i); return m; }
function weekStatus(mid,w){
  var paid=memWeekPaid(mid,w);
  var pays=(state.payments||[]).filter(function(p){return p.memberId===mid && Number(p.weekIndex)===w;});
  if (paid>=state.rate) return pays.some(isLate) ? "late-paid" : "paid";
  if (paid>0) return "partial";
  if (isPast(w)) return "missed";
  if (isFuture(w)) return "pending";
  return "none";
}
function memOverall(mid,cur){
  var paid=memPaid(mid), exp=state.rate*(cur+1), tgt=state.rate*state.weeksCount;
  if (paid>=tgt) return {t:"DONE",c:"done"};
  if (paid>=exp+state.rate) return {t:"AHEAD",c:"ahead"};
  if (paid<exp-state.rate) return {t:"BEHIND",c:"behind"};
  return {t:"OK",c:"ok"};
}
function memStreak(mid){
  var cur=curWeek(), streak=0;
  for (var i=cur-1;i>=0;i--){
    if (!isPast(i)) continue;
    var paid=memWeekPaid(mid,i);
    var pays=(state.payments||[]).filter(function(p){return p.memberId===mid && Number(p.weekIndex)===i;});
    if (paid>=state.rate && !pays.some(isLate)) streak++;
    else break;
  }
  return streak;
}
function predictCompletion(){
  var target=state.rate*state.weeksCount*state.members.length;
  var collected=(state.payments||[]).reduce(function(s,p){return s+Number(p.amount);},0);
  var remaining=target-collected;
  if (remaining<=0) return null;
  var cur=curWeek(); if (cur<1) return null;
  var avg=collected/(cur+1); if (avg<=0) return null;
  var need=Math.ceil(remaining/avg), fin=cur+need;
  if (fin>=state.weeksCount) return {late:true};
  return {date:fmtD(weekDate(fin)),late:false};
}
function abbr(n){ n=Number(n||0); if(n>=1e6) return "₱"+(n/1e6).toFixed(n%1e6===0?0:1)+"M"; if(n>=1e4) return "₱"+(n/1e3).toFixed(n%1e3===0?0:1)+"k"; return "₱"+n.toLocaleString(); }
function full(n){ return "₱"+Number(n||0).toLocaleString(); }

    var missed = state.members.reduce(function(s,m){return s+memMissed(m.id).length;},0);
    var daysToTrip = Math.max(0, Math.ceil((weekDeadline(state.weeksCount-1)-nowMs())/86400000));

    var chips = [];
    chips.push({t: abbr(remaining)+" left"});

    if (daysToTrip>0 && daysToTrip<=365) chips.push({t: daysToTrip+"d to trip", u: daysToTrip<30});
    if (pred && !pred.late) chips.push({t:"🎯 Fund by "+pred.date, p:true});

    if (pct>=100) chips.push({t:"🎉 Funded!", w:true});
    document.getElementById("chips").innerHTML = chips.map(function(c){
      return '<span class="chip'+(c.u?' urgent':'')+(c.w?' win':'')+(c.p?' predict':'')+'">'+c.t+'</span>';

  var mem = state.members.find(function(m){return m.id===mid;});
  var past = isPast(w);
  state.payments = state.payments || [];
  state.payments.push({id:Date.now(), memberId:mid, weekIndex:w, amount:amt, note: past?"Late catch-up":"Quick", timestamp:new Date().toISOString(), isLate:past});
  sync(); renderAll();
  toast("⚡ "+mem.name+" · "+full(amt)+(past?" Late":""), past?"late":null);
  if (hasConfetti && !device.reducedMotion) try{ confetti({particleCount:50,spread:60,origin:{y:.85}}); }catch(e){}
}

function submitPayment(e){
  e.preventDefault();
  var mid = Number(document.getElementById("pay-member").value);
  var w = Number(document.getElementById("pay-week").value);
  var amt = Number(document.getElementById("pay-amount").value);
  var note = document.getElementById("pay-note").value.trim();
  if (!amt || amt<1){ toast("Invalid amount","err"); return; }
  var data = {memberId:mid, weekIndex:w, amount:amt, note:note};
  if (editingId){
    var p = state.payments.find(function(x){return x.id===editingId;});
    if (p){ Object.assign(p,data); p.isLate = isLate(p); }
    toast("Updated");
  } else {
    state.payments = state.payments || [];
    var late = payType==="late" || isPast(w);
    state.payments.push(Object.assign({id:Date.now(), timestamp:new Date().toISOString(), isLate:late}, data));
    toast(late ? "⏰ Late saved" : "Saved 🌴", late?"late":"win");
    if (hasConfetti && !device.reducedMotion) try{ confetti({particleCount:70,spread:70,origin:{y:.8},colors: late?['#8b5cf6','#a855f7','#c4b5fd']:undefined}); }catch(e){}

  editingId = null;
  sync(); renderAll(); closeModal("m-payment");
  haptic([15,50,15]);
}

function deletePayment(id){
  var p = state.payments.find(function(x){return x.id===id;});
  if (!p) return;
  haptic(20);
  state.payments = state.payments.filter(function(x){return x.id!==id;});
  sync(); renderAll();
  if (document.getElementById("m-history").classList.contains("open")) renderHistory();
  undoStack = {type:"payment", data:p};
  toastUndo("Payment removed", function(){
    state.payments.push(undoStack.data); undoStack=null;
    sync(); renderAll();
    if (document.getElementById("m-history").classList.contains("open")) renderHistory();
    toast("Restored ✓","win");
  });
}

function addMember(){
  var inp = document.getElementById("new-mem");
  var n = inp.value.trim();
  if (!n) return toast("Enter name","err");
  if (state.members.some(function(m){return m.name.toLowerCase()===n.toLowerCase();})) return toast("Exists","err");
  var id = (state.members.reduce(function(m,x){return Math.max(m,x.id);},0) || 0) + 1;
  state.members.push({id:id, name:n});
  inp.value = "";
  sync(); renderMemList(); renderAll();
  toast(n+" added","win");
}
function removeMember(id){
  var m = state.members.find(function(x){return x.id===id;});
  if (!m) return;
  var cnt = state.payments.filter(function(p){return p.memberId===id;}).length;
  if (!confirm("Remove "+m.name+(cnt?" and "+cnt+" pay(s)":"")+"?")) return;
  var backup = {member:m, payments: state.payments.filter(function(p){return p.memberId===id;})};
  state.members = state.members.filter(function(x){return x.id!==id;});
  state.payments = state.payments.filter(function(p){return p.memberId!==id;});
  sync(); renderMemList(); renderAll();
  undoStack = {type:"member", data:backup};
  toastUndo(m.name+" removed", function(){
    state.members.push(undoStack.data.member);
    undoStack.data.payments.forEach(function(p){ state.payments.push(p); });
    undoStack = null;
    sync(); renderMemList(); renderAll();
    toast("Restored ✓","win");
  });
}

function renderQR(type){
  try {
    document.getElementById("qr-tgl-gcash").classList.toggle("active", type==='gcash');
    document.getElementById("qr-tgl-mari").classList.toggle("active", type==='mari');
    var num = type==='gcash' ? state.gcashNumber : state.mariNumber;
    var nm  = type==='gcash' ? state.gcashName   : state.mariName;
    document.getElementById("qr-name").textContent = (type==='gcash' ? 'GCash · ' : 'MariBank · ') + nm;
    document.getElementById("qr-num").textContent = num;

    var slot = document.getElementById("qr-slot");
    slot.innerHTML = "";
    if (hasQR && window.QRCode){
      var c = document.createElement("canvas");
      slot.appendChild(c);
      QRCode.toCanvas(c, num, {width:240, margin:2, color:{dark:'#0284c7', light:'#ffffff'}}, function(){});
    } else {
      // fallback to Google Charts image API
      var img = document.createElement("img");
      img.width = 240; img.height = 240;
      img.alt = "QR "+num;
      img.src = "https://api.qrserver.com/v1/create-qr-code/?size=240x240&color=0284c7&data="+encodeURIComponent(num);
      img.onerror = function(){
        slot.innerHTML = '<div class="qr-warn">QR unavailable offline.<br>Number:<br><b style="font-size:18px">'+num+'</b></div>';
      };
      slot.appendChild(img);
    }
  } catch(e){
    document.getElementById("qr-slot").innerHTML = '<div class="qr-warn">QR unavailable.</div>';
  }
}
function showQR(type){ openModal("m-qr"); setTimeout(function(){ renderQR(type); }, 60); }

/* ================================================================
   Share / copy
================================================================ */
function copySummary(){
  try {
    var cur = curWeek();
    var target = state.rate*state.weeksCount*state.members.length;
    var collected = (state.payments||[]).reduce(function(s,p){return s+Number(p.amount);},0);
    var pct = target ? Math.round(collected/target*100) : 0;
    var bar = "█".repeat(Math.round(pct/10)) + "░".repeat(10-Math.round(pct/10));
    var pred = predictCompletion();
    var t = "🏝️ "+state.tripName.toUpperCase()+"\n━━━━━━━━━━━━━━━━━━━━\n";
    t += bar+" "+pct+"%\n💰 "+full(collected)+" / "+full(target)+"\n\n";
    t += "📅 Wk "+(cur+1)+"/"+state.weeksCount+" · "+fmtD(weekDate(cur))+"\n⏰ "+countdown(weekDeadline(cur))+"\n";
    if (pred && !pred.late) t += "🎯 Funded by ~"+pred.date+"\n";
    t += "\n💳 GCash: "+state.gcashNumber+" ("+state.gcashName+")\n💳 MariBank: "+state.mariNumber+" ("+state.mariName+")\n📝 Note: [Name] Wk[#]\n━━━━━━━━━━━━━━━━━━━━\n";
    state.members.forEach(function(m){
      var paid = memPaid(m.id), mT = state.rate*state.weeksCount;
      var p = mT ? Math.round(paid/mT*100) : 0;
      var miss = memMissed(m.id).length, stk = memStreak(m.id);
      var e = p>=100?"✅":p>=75?"🟢":p>=50?"🟡":"🔴";
      t += e+" "+m.name+": "+full(paid)+"/"+full(mT)+" ("+p+"%)"+(miss?" ⚠"+miss:"")+(stk>=2?" 🔥"+stk:"")+"\n";
    });
    t += "━━━━━━━━━━━━━━━━━━━━\n"+new Date().toLocaleString("en-PH",{timeZone:TZ,month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true});
    navigator.clipboard.writeText(t).then(function(){ toast("Copied 📋","win"); }, function(){ toast("Copy failed","err"); });
  } catch(e){ toast("Copy failed","err"); }
}
function copyGCash(){ try{ navigator.clipboard.writeText(state.gcashNumber||"").then(function(){ toast("GCash copied 📱"); }); }catch(e){} haptic(); }
function copyMari(){ try{ navigator.clipboard.writeText(state.mariNumber||"").then(function(){ toast("MariBank copied 🏦"); }); }catch(e){} haptic(); }

function exportBackup(){
  try {
    var blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "olango_"+new Date().toISOString().split("T")[0]+".json";
    a.click();
    toast("Backup 💾","win");
  } catch(e){ toast("Backup failed","err"); }
}
function importBackup(){ document.getElementById("import-input").click(); }
function handleImport(e){
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(ev){
    try {
      var d = JSON.parse(ev.target.result);
      if (!d.members) throw new Error();
      if (!confirm("Replace all data?")) return;
      state = Object.assign({}, defaultState, d);
      sync(); renderAll(); toast("Restored ✓","win");
    } catch(err){ toast("Invalid file","err"); }
  };
  r.readAsText(f); e.target.value = "";
}
function promptReset(){
  if (!confirm("Reset EVERYTHING?")) return;
  if (!confirm("Final warning")) return;
  state = JSON.parse(JSON.stringify(defaultState));
  sync(); renderAll(); toast("Reset","warn");
}

function checkMilestones(pct){
  [25,50,75,100].forEach(function(m){
    if (pct>=m && !milestones.has(m)){
      milestones.add(m);
      if (milestones.size>1 || pct>5){
        setTimeout(function(){
          if (hasConfetti && !device.reducedMotion) try{ confetti({particleCount:100,spread:80,origin:{y:.6}}); }catch(e){}
          toast("🎉 "+m+"% reached!","win");
        }, 300);
      }
    }
  });
}

function toast(msg,type){
  try {
    var box = document.getElementById("toast-box");
    var el = document.createElement("div");
    el.className = "toast" + (type?" "+type:"");
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(function(){ try{ el.remove(); }catch(e){} }, 3200);
  } catch(e){}
}
function toastUndo(msg, undoFn){
  try {
    var box = document.getElementById("toast-box");
    var el = document.createElement("div");
    el.className = "toast warn";
    el.innerHTML = '<span>'+msg+'</span>';
    var btn = document.createElement("button");
    btn.className = "toast-btn";
    btn.textContent = "UNDO";
    btn.onclick = function(){ undoFn(); el.remove(); };
    el.appendChild(btn);
    box.appendChild(el);
    setTimeout(function(){ try{ el.remove(); }catch(e){} }, 10000);
  } catch(e){}
}

function scrollTop(){ try{ window.scrollTo({top:0, behavior: device.reducedMotion?'auto':'smooth'}); }catch(e){} }

if (device.isDesktop){
  document.addEventListener("keydown", function(e){
    if (e.target.matches("input,select,textarea")) return;
    if (e.key==="n"||e.key==="N"){ e.preventDefault(); openPayment(); }
    if (e.key==="l"||e.key==="L"){ e.preventDefault(); openPayment(null,true); }
    if (e.key==="h"||e.key==="H"){ e.preventDefault(); openModal("m-history"); }
    if (e.key==="m"||e.key==="M"){ e.preventDefault(); openModal("m-members"); }
    if (e.key==="Escape"){ ["m-payment","m-members","m-history","m-settings","m-qr"].forEach(function(id){ closeModal(id); }); }
  });
}

/* ================================================================
   BOOT — render UI first, everything else in background
================================================================ */
(function boot(){
  // Render immediately from local cache — guaranteed UI in <100ms
  try { renderAll(); } catch(e){}
  hideLoader();

  // Load optional confetti (never blocks)
  loadScript("https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js", 2500)
    .then(function(ok){ hasConfetti = !!(ok && window.confetti); });

  // Load optional QR lib (never blocks; we have image fallback)
  loadScript("https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js", 2500)
    .then(function(ok){ hasQR = !!(ok && window.QRCode); });

  // Load Firebase in background
  initFirebase();

  // Ticks
  setInterval(tickClock, 1000);
  setInterval(renderAll, 30000);
  window.addEventListener("beforeunload", saveLocal);
  window.addEventListener("orientationchange", function(){ setTimeout(renderAll,100); });
})();
</script>
